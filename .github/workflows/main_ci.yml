name: Enterprise AI QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'  # Daily regression build

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      BASE_URL: https://sleepapneabd.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Test Suites
        run: |
          python -m pytest tests/api tests/audit tests/ai --html=reports/report.html --self-contained-html -v --tb=short

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-test-report
          path: reports/report.html
