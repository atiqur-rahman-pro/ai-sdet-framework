name: Enterprise AI QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'  # Daily regression build

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run API & Technical Audit Tests
        run: |
          pytest -m "api or audit or ai" --html=reports/report.html

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: qa-test-report
          path: reports/report.html
